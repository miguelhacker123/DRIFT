<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jogo de Carro Estilo LEGO / Roblox</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }

    /* UI / Controles */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 2px solid #fff;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      active { background: rgba(255, 255, 255, 0.4); }
    }

    .btn-nitro {
      background: linear-gradient(45deg, #ff0055, #ff5500);
      border: 2px solid #ffff00;
      text-shadow: 0 0 5px #000;
    }

    .btn-action {
      background: #4caf50;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    /* D-Pad On Screen Controls */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(3, 55px);
      gap: 5px;
      pointer-events: auto;
    }

    .dpad button {
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid #fff;
      color: white;
      font-size: 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    #speedometer {
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0,0,0,0.5);
      padding: 8px 15px;
      border-radius: 5px;
    }
  </style>

  <!-- Importing Three.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <div class="hud-top">
      <button class="btn" id="btn-cam">📹 Câmera (C)</button>
      <div id="speedometer">0 km/h</div>
      <button class="btn btn-action" id="btn-interact">🚗 Entrar/Sair (E)</button>
    </div>

    <div class="hud-bottom">
      <div class="dpad">
        <div></div>
        <button id="btn-up">▲</button>
        <div></div>
        <button id="btn-left">◀</button>
        <button id="btn-down">▼</button>
        <button id="btn-right">▶</button>
      </div>

      <div class="action-buttons">
        <button class="btn btn-nitro" id="btn-nitro">⚡ NITRO (Shift)</button>
      </div>
    </div>
  </div>

  <script>
    // --- CENA BÁSICA E RENDERIZADOR ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec0ee);
    scene.fog = new THREE.FogExp2(0x7ec0ee, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- ILUMINAÇÃO ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 80, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 250;
    dirLight.shadow.camera.left = -50;
    dirLight.shadow.camera.right = 50;
    dirLight.shadow.camera.top = 50;
    dirLight.shadow.camera.bottom = -50;
    scene.add(dirLight);

    // --- BASEPLATE ESTILO ROBLOX / LEGO ---
    const baseplateSize = 200;
    const baseplateGroup = new THREE.Group();

    // Placa cinza principal
    const plateGeo = new THREE.BoxGeometry(baseplateSize, 2, baseplateSize);
    const plateMat = new THREE.MeshStandardMaterial({ color: 0xa0a0a0, roughness: 0.5 });
    const baseplate = new THREE.Mesh(plateGeo, plateMat);
    baseplate.position.y = -1;
    baseplate.receiveShadow = true;
    baseplateGroup.add(baseplate);

    // Pinos (Studs) LEGO em grade
    const studGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 12);
    const studMat = new THREE.MeshStandardMaterial({ color: 0x909090, roughness: 0.5 });
    const studInstanced = new THREE.InstancedMesh(studGeo, studMat, (baseplateSize / 2) * (baseplateSize / 2));
    
    let index = 0;
    const dummy = new THREE.Object3D();
    for (let x = -baseplateSize / 2 + 1; x < baseplateSize / 2; x += 2) {
      for (let z = -baseplateSize / 2 + 1; z < baseplateSize / 2; z += 2) {
        dummy.position.set(x, 0.1, z);
        dummy.updateMatrix();
        studInstanced.setMatrixAt(index++, dummy.matrix);
      }
    }
    studInstanced.receiveShadow = true;
    baseplateGroup.add(studInstanced);
    scene.add(baseplateGroup);

    // --- CRIAÇÃO DO CARRO (ECLIPSE VERDE BRIAN ESTILO LEGO) ---
    const car = new THREE.Group();

    // Chassi / Corpo do Carro
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x32cd32, roughness: 0.3, metalness: 0.1 }); // Verde limão
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, transparent: true, opacity: 0.8 });
    const silverMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });

    // Corpo principal
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.5), bodyMat);
    carBody.position.y = 0.6;
    carBody.castShadow = true;
    car.add(carBody);

    // Cabine / Parabrisa
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), glassMat);
    cabin.position.set(0, 1.2, -0.2);
    cabin.castShadow = true;
    car.add(cabin);

    // Capô escuro (estilo tuning)
    const hood = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.05, 1.5), darkMat);
    hood.position.set(0, 1.03, 1.2);
    car.add(hood);

    // Aerofólio Traseiro
    const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.5), darkMat);
    spoilerWing.position.set(0, 1.4, -2.0);
    const spoilerMount1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), darkMat);
    spoilerMount1.position.set(-0.7, 1.15, -2.0);
    const spoilerMount2 = spoilerMount1.clone();
    spoilerMount2.position.x = 0.7;
    car.add(spoilerWing, spoilerMount1, spoilerMount2);

    // Neon Azul Embaixo
    const neonMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const neon = new THREE.Mesh(new THREE.PlaneGeometry(2, 4), neonMat);
    neon.rotation.x = -Math.PI / 2;
    neon.position.y = 0.05;
    car.add(neon);

    const neonLight = new THREE.PointLight(0x00ffff, 2, 5);
    neonLight.position.y = 0.2;
    car.add(neonLight);

    // Rodas
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheels = [];
    const wheelPositions = [
      [-1.1, 0.4, 1.4], [1.1, 0.4, 1.4],
      [-1.1, 0.4, -1.4], [1.1, 0.4, -1.4]
    ];

    wheelPositions.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeo, darkMat);
      wheel.position.set(...pos);
      wheel.castShadow = true;
      car.add(wheel);
      wheels.push(wheel);
    });

    car.position.set(0, 0, 0);
    scene.add(car);

    // --- CRIAÇÃO DO PERSONAGEM (LEGO/ROBLOX STYLE) ---
    const player = new THREE.Group();
    const playerMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.4 }); // Cor Amarela Lego
    const shirtMat = new THREE.MeshStandardMaterial({ color: 0x0055ff }); // Camisa azul

    // Cabeça
    const head = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5, 12), playerMat);
    head.position.y = 1.4;
    head.castShadow = true;
    player.add(head);

    // Tronco
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.4), shirtMat);
    torso.position.y = 0.8;
    torso.castShadow = true;
    player.add(torso);

    // Pernas
    const legs = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.4), darkMat);
    legs.position.y = 0.3;
    legs.castShadow = true;
    player.add(legs);

    player.position.set(5, 0, 5);
    scene.add(player);

    // --- VARIÁVEIS DE ESTADO E CONTROLES ---
    let isDriving = false;
    let cameraMode = 0; // 0: 3ª Pessoa, 1: 1ª Pessoa

    // Física simples do Carro
    let carSpeed = 0;
    const maxSpeed = 0.6;
    const nitroSpeed = 1.1;
    const accel = 0.015;
    const friction = 0.96;
    let carAngle = 0;

    // Física do Jogador
    const playerSpeed = 0.15;
    let playerAngle = 0;

    // Teclado
    const keys = { w: false, a: false, s: false, d: false, shift: false };

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (k === 's' || e.key === 'ArrowDown') keys.s = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
      if (e.key === 'Shift') keys.shift = true;
      if (k === 'e') toggleDrive();
      if (k === 'c') cycleCamera();
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (k === 's' || e.key === 'ArrowDown') keys.s = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
      if (e.key === 'Shift') keys.shift = false;
    });

    // Eventos Touch / Botões UI
    const setupTouchButton = (id, key) => {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
      btn.addEventListener('mousedown', () => keys[key] = true);
      btn.addEventListener('mouseup', () => keys[key] = false);
    };

    setupTouchButton('btn-up', 'w');
    setupTouchButton('btn-left', 'a');
    setupTouchButton('btn-down', 's');
    setupTouchButton('btn-right', 'd');
    setupTouchButton('btn-nitro', 'shift');

    document.getElementById('btn-interact').addEventListener('click', toggleDrive);
    document.getElementById('btn-cam').addEventListener('click', cycleCamera);

    function toggleDrive() {
      if (!isDriving) {
        // Entrar se estiver perto do carro
        const dist = player.position.distanceTo(car.position);
        if (dist < 4) {
          isDriving = true;
          player.visible = false;
        }
      } else {
        // Sair do carro
        isDriving = false;
        player.visible = true;
        player.position.set(car.position.x + 2, 0, car.position.z);
      }
    }

    function cycleCamera() {
      cameraMode = (cameraMode + 1) % 2;
    }

    // --- LOOP PRINCIPAL DE ANIMAÇÃO ---
    function animate() {
      requestAnimationFrame(animate);

      if (isDriving) {
        // Lógica do Carro
        const currentMaxSpeed = keys.shift ? nitroSpeed : maxSpeed;

        if (keys.w) carSpeed = Math.min(carSpeed + accel, currentMaxSpeed);
        else if (keys.s) carSpeed = Math.max(carSpeed - accel, -maxSpeed / 2);
        else carSpeed *= friction;

        if (Math.abs(carSpeed) > 0.01) {
          const dir = carSpeed > 0 ? 1 : -1;
          if (keys.a) carAngle += 0.03 * dir;
          if (keys.d) carAngle -= 0.03 * dir;
        }

        car.rotation.y = carAngle;
        car.position.x += Math.sin(carAngle) * carSpeed;
        car.position.z += Math.cos(carAngle) * carSpeed;

        // Girar rodas ao andar
        wheels.forEach(w => w.rotation.x += carSpeed);

        // Atualizar Velocímetro
        document.getElementById('speedometer').innerText = `${Math.round(Math.abs(carSpeed) * 120)} km/h`;

        // Posições da Câmera no Carro
        if (cameraMode === 0) { // 3ª Pessoa Carro
          const camOffset = new THREE.Vector3(0, 3, -7).applyAxisAngle(new THREE.Vector3(0, 1, 0), carAngle);
          camera.position.copy(car.position).add(camOffset);
          camera.lookAt(car.position.x, car.position.y + 1, car.position.z);
        } else { // 1ª Pessoa Carro (Dentro do Cockpit)
          const camOffset = new THREE.Vector3(0, 1.1, 0.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), carAngle);
          camera.position.copy(car.position).add(camOffset);
          const lookAtPos = car.position.clone().add(new THREE.Vector3(0, 1.1, 10).applyAxisAngle(new THREE.Vector3(0, 1, 0), carAngle));
          camera.lookAt(lookAtPos);
        }

      } else {
        // Lógica a Pé (Personagem)
        let moveX = 0;
        let moveZ = 0;

        if (keys.w) moveZ += 1;
        if (keys.s) moveZ -= 1;
        if (keys.a) moveX += 1;
        if (keys.d) moveX -= 1;

        if (moveX !== 0 || moveZ !== 0) {
          playerAngle = Math.atan2(moveX, moveZ);
          player.rotation.y = playerAngle;
          player.position.x += Math.sin(playerAngle) * playerSpeed;
          player.position.z += Math.cos(playerAngle) * playerSpeed;
        }

        document.getElementById('speedometer').innerText = `A pé`;

        // Posições da Câmera a Pé
        if (cameraMode === 0) { // 3ª Pessoa
          camera.position.set(player.position.x, player.position.y + 4, player.position.z - 8);
          camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
        } else { // 1ª Pessoa
          camera.position.set(player.position.x, player.position.y + 1.4, player.position.z);
          const lookPos = new THREE.Vector3(
            player.position.x + Math.sin(playerAngle) * 5,
            player.position.y + 1.4,
            player.position.z + Math.cos(playerAngle) * 5
          );
          camera.lookAt(lookPos);
        }
      }

      renderer.render(scene, camera);
    }

    // Redimensionamento de tela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
