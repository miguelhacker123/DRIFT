<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eclipse LEGO Drift & Stunt City</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a24;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }

    /* interface / HUD */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-card {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.4);
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 10px;
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.1s ease;
      text-transform: uppercase;
    }
    .btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.3);
    }

    .btn-nitro {
      background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);
      border: 2px solid #ffff00;
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.6);
    }

    .btn-action {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      border: 2px solid #ffffff;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    /* Controles Touch */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 6px;
      pointer-events: auto;
    }

    .dpad button {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 22px;
      border-radius: 12px;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }
    .dpad button:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    #speedometer {
      font-size: 22px;
      letter-spacing: 1px;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    #instructions {
      position: absolute;
      top: 70px;
      left: 15px;
      color: #aaa;
      font-size: 12px;
      pointer-events: none;
    }
  </style>

  <!-- Bibliotecas Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <div class="hud-top">
      <button class="btn" id="btn-cam">📷 CAM (C)</button>
      <div class="hud-card" id="speedometer">0 KM/H</div>
      <button class="btn btn-action" id="btn-interact">🚗 Entrar/Sair (E)</button>
    </div>

    <div id="instructions">PC: WASD / Setas | Shift = Nitro | E = Entrar/Sair | C = Câmera</div>

    <div class="hud-bottom">
      <div class="dpad">
        <div></div>
        <button id="btn-up">▲</button>
        <div></div>
        <button id="btn-left">◀</button>
        <button id="btn-down">▼</button>
        <button id="btn-right">▶</button>
      </div>

      <div class="action-buttons">
        <button class="btn btn-nitro" id="btn-nitro">⚡ NITRO</button>
      </div>
    </div>
  </div>

  <script>
    // --- SINTETIZADOR DE ÁUDIO (FX Sonoros sem arquivos externos) ---
    const AudioFX = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playEngineSound(speed) {
        if (!this.ctx) return;
        // Modulação básica para efeito de áudio
      },
      playNitroSound() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
      }
    };

    // --- CENA BÁSICA E ILUMINAÇÃO ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x68a0e5);
    scene.fog = new THREE.FogExp2(0x68a0e5, 0.005);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Luzes
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(100, 150, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 400;
    const d = 100;
    sun.shadow.camera.left = -d;
    sun.shadow.camera.right = d;
    sun.shadow.camera.top = d;
    sun.shadow.camera.bottom = -d;
    scene.add(sun);

    // --- MAPA / BASEPLATE LEGO + CIDADE ---
    const mapGroup = new THREE.Group();
    const mapSize = 300;

    // Chão Base (Baseplate Verde LEGO)
    const baseGeo = new THREE.BoxGeometry(mapSize, 4, mapSize);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x359e35, roughness: 0.6 });
    const basePlate = new THREE.Mesh(baseGeo, baseMat);
    basePlate.position.y = -2;
    basePlate.receiveShadow = true;
    mapGroup.add(basePlate);

    // Pistas Asfaltadas Escuras
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
    const roadMain = new THREE.Mesh(new THREE.PlaneGeometry(40, mapSize), roadMat);
    roadMain.rotation.x = -Math.PI / 2;
    roadMain.position.y = 0.02;
    roadMain.receiveShadow = true;
    mapGroup.add(roadMain);

    const roadCross = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, 40), roadMat);
    roadCross.rotation.x = -Math.PI / 2;
    roadCross.position.y = 0.02;
    roadCross.receiveShadow = true;
    mapGroup.add(roadCross);

    // Studs LEGO (Pinos no chão fora da pista)
    const studGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 10);
    const studMat = new THREE.MeshStandardMaterial({ color: 0x2d8a2d, roughness: 0.5 });
    const studInstances = new THREE.InstancedMesh(studGeo, studMat, 2500);
    let idx = 0;
    const dummy = new THREE.Object3D();

    for (let x = -mapSize/2 + 3; x < mapSize/2; x += 6) {
      for (let z = -mapSize/2 + 3; z < mapSize/2; z += 6) {
        if (Math.abs(x) > 22 && Math.abs(z) > 22) { // Não colocar pino na estrada
          dummy.position.set(x, 0.1, z);
          dummy.updateMatrix();
          studInstances.setMatrixAt(idx++, dummy.matrix);
        }
      }
    }
    studInstances.receiveShadow = true;
    mapGroup.add(studInstances);

    // Rampa de Acrobacia (Stunt Jump)
    const rampGeo = new THREE.BoxGeometry(12, 4, 15);
    const rampMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.3 });
    const ramp = new THREE.Mesh(rampGeo, rampMat);
    ramp.position.set(0, 1, 40);
    ramp.rotation.x = -0.25;
    ramp.castShadow = true;
    ramp.receiveShadow = true;
    mapGroup.add(ramp);

    // Prédios LEGO
    const buildingColors = [0xde2b2b, 0x2b52de, 0xf0c419, 0xffffff, 0x9b2bde];
    for (let i = 0; i < 16; i++) {
      const h = 20 + Math.random() * 40;
      const w = 15 + Math.random() * 10;
      const bGeo = new THREE.BoxGeometry(w, h, w);
      const bMat = new THREE.MeshStandardMaterial({ 
        color: buildingColors[Math.floor(Math.random() * buildingColors.length)], 
        roughness: 0.3 
      });
      const b = new THREE.Mesh(bGeo, bMat);
      
      const bx = (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 80);
      const bz = (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 80);
      b.position.set(bx, h/2, bz);
      b.castShadow = true;
      b.receiveShadow = true;
      mapGroup.add(b);
    }

    scene.add(mapGroup);

    // --- CARRO ECLIPSE DO BRIAN (VERDE TUNADO) ---
    const car = new THREE.Group();

    // Materiais
    const limeMat = new THREE.MeshStandardMaterial({ color: 0x3be813, roughness: 0.2, metalness: 0.1 });
    const darkCarbon = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.4 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, transparent: true, opacity: 0.85 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.9, roughness: 0.1 });
    const neonCyan = new THREE.MeshBasicMaterial({ color: 0x00ffff });

    // Chassis Base
    const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.7, 4.8), limeMat);
    chassis.position.y = 0.65;
    chassis.castShadow = true;
    car.add(chassis);

    // Teto / Cabine
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.65, 2.3), glassMat);
    cabin.position.set(0, 1.25, -0.2);
    cabin.castShadow = true;
    car.add(cabin);

    // Capô Preto (Estilo fibra de carbono)
    const hood = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.08, 1.6), darkCarbon);
    hood.position.set(0, 1.02, 1.3);
    car.add(hood);

    // Decalque Lateral / Saias
    const skirtL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 3.5), darkCarbon);
    skirtL.position.set(1.18, 0.4, 0);
    const skirtR = skirtL.clone();
    skirtR.position.x = -1.18;
    car.add(skirtL, skirtR);

    // Aerofólio Alto (Spoiler GT)
    const spoilerBar = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.08, 0.6), darkCarbon);
    spoilerBar.position.set(0, 1.5, -2.1);
    const mount1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.2), darkCarbon);
    mount1.position.set(-0.8, 1.2, -2.1);
    const mount2 = mount1.clone();
    mount2.position.x = 0.8;
    car.add(spoilerBar, mount1, mount2);

    // Neon Neon Underglow
    const neonPlate = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 4.2), neonCyan);
    neonPlate.rotation.x = -Math.PI / 2;
    neonPlate.position.y = 0.08;
    car.add(neonPlate);

    const neonLight = new THREE.PointLight(0x00ffff, 3, 7);
    neonLight.position.y = 0.2;
    car.add(neonLight);

    // Rodas Tunadas com Aros Esportivos
    const wheels = [];
    const wheelGroup = new THREE.Group();
    const wGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 18);
    wGeo.rotateZ(Math.PI / 2);

    const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.36, 6);
    rimGeo.rotateZ(Math.PI / 2);

    const wPositions = [
      [-1.2, 0.45, 1.5], [1.2, 0.45, 1.5],
      [-1.2, 0.45, -1.5], [1.2, 0.45, -1.5]
    ];

    wPositions.forEach(pos => {
      const wMesh = new THREE.Mesh(wGeo, darkCarbon);
      const rMesh = new THREE.Mesh(rimGeo, chromeMat);
      const singleWheel = new THREE.Group();
      singleWheel.add(wMesh, rMesh);
      singleWheel.position.set(...pos);
      singleWheel.castShadow = true;
      wheels.push(singleWheel);
      car.add(singleWheel);
    });

    // Escapamento Dual + Partículas de Nitro
    const exhaustGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8);
    exhaustGeo.rotateX(Math.PI / 2);
    const exhaust = new THREE.Mesh(exhaustGeo, chromeMat);
    exhaust.position.set(-0.6, 0.4, -2.4);
    car.add(exhaust);

    // Sistema de Partículas de Nitro (Fogo/Fumaça)
    const particleCount = 40;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i++) pPos[i] = 0;
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    
    const pMat = new THREE.PointsMaterial({
      color: 0x00ffff,
      size: 0.35,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });
    const nitroParticles = new THREE.Points(pGeo, pMat);
    nitroParticles.visible = false;
    car.add(nitroParticles);

    car.position.set(0, 0.2, 0);
    scene.add(car);

    // --- PERSONAGEM LEGO / ROBLOX ---
    const player = new THREE.Group();
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffcd03, roughness: 0.3 });
    const shirtMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const bluePants = new THREE.MeshStandardMaterial({ color: 0x0033cc, roughness: 0.5 });

    // Cabeça + Capacete
    const pHead = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.45, 12), headMat);
    pHead.position.y = 1.35;
    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), limeMat);
    helmet.position.y = 1.4;
    player.add(pHead, helmet);

    // Torso
    const pTorso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.35), shirtMat);
    pTorso.position.y = 0.8;
    pTorso.castShadow = true;
    player.add(pTorso);

    // Braços e Pernas Articulados
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.65, 0.2), shirtMat);
    armL.position.set(-0.48, 0.8, 0);
    const armR = armL.clone();
    armR.position.x = 0.48;
    player.add(armL, armR);

    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.65, 0.3), bluePants);
    legL.position.set(-0.2, 0.3, 0);
    const legR = legL.clone();
    legR.position.x = 0.2;
    player.add(legL, legR);

    player.position.set(4, 0, 4);
    scene.add(player);

    // --- SISTEMA DE CONTROLES E FÍSICA ---
    let isDriving = false;
    let cameraMode = 0; // 0: 3ª Pessoa Chase, 1: 1ª Pessoa Cockpit, 2: Visão de Cima

    // Física do Carro
    let speed = 0;
    let maxSpeedNormal = 0.7;
    let maxSpeedNitro = 1.35;
    let acceleration = 0.02;
    let friction = 0.965;
    let steering = 0;
    let carRotation = 0;

    // Teclado
    const keys = { w: false, a: false, s: false, d: false, shift: false };

    window.addEventListener('keydown', (e) => {
      AudioFX.init();
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (k === 's' || e.key === 'ArrowDown') keys.s = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
      if (e.key === 'Shift') keys.shift = true;
      if (k === 'e') toggleDrive();
      if (k === 'c') cycleCamera();
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (k === 's' || e.key === 'ArrowDown') keys.s = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
      if (e.key === 'Shift') keys.shift = false;
    });

    // Touch Buttons Setup
    const bindTouch = (id, key) => {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); AudioFX.init(); keys[key] = true; };
      const end = (e) => { e.preventDefault(); keys[key] = false; };
      el.addEventListener('touchstart', start);
      el.addEventListener('touchend', end);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
    };

    bindTouch('btn-up', 'w');
    bindTouch('btn-left', 'a');
    bindTouch('btn-down', 's');
    bindTouch('btn-right', 'd');
    bindTouch('btn-nitro', 'shift');

    document.getElementById('btn-interact').addEventListener('click', () => { AudioFX.init(); toggleDrive(); });
    document.getElementById('btn-cam').addEventListener('click', () => { AudioFX.init(); cycleCamera(); });

    function toggleDrive() {
      if (!isDriving) {
        if (player.position.distanceTo(car.position) < 5) {
          isDriving = true;
          player.visible = false;
        }
      } else {
        isDriving = false;
        player.visible = true;
        player.position.set(car.position.x + 2.5, 0, car.position.z);
      }
    }

    function cycleCamera() {
      cameraMode = (cameraMode + 1) % 3;
    }

    // Variáveis da Câmera Suave
    const targetCamPos = new THREE.Vector3();
    const currentCamPos = new THREE.Vector3(0, 10, -10);

    // --- LOOP DE ANIMAÇÃO ---
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      animTime += 0.05;

      if (isDriving) {
        // Aceleração & Nitro
        const topSpd = keys.shift ? maxSpeedNitro : maxSpeedNormal;
        
        if (keys.shift && keys.w) {
          nitroParticles.visible = true;
          // Animar partículas de nitro
          const positions = nitroParticles.geometry.attributes.position.array;
          for(let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 0.3;
            positions[i+1] = (Math.random() - 0.5) * 0.3;
            positions[i+2] = -2.4 - Math.random() * 1.5;
          }
          nitroParticles.geometry.attributes.position.needsUpdate = true;
          if (Math.random() > 0.7) AudioFX.playNitroSound();
        } else {
          nitroParticles.visible = false;
        }

        if (keys.w) speed = Math.min(speed + acceleration, topSpd);
        else if (keys.s) speed = Math.max(speed - acceleration, -maxSpeedNormal * 0.4);
        else speed *= friction;

        // Direção (Steering)
        if (Math.abs(speed) > 0.005) {
          const dir = speed > 0 ? 1 : -1;
          if (keys.a) carRotation += 0.035 * dir;
          if (keys.d) carRotation -= 0.035 * dir;
        }

        car.rotation.y = carRotation;

        // Efeito Visual de Suspensão / Inclinada nas curvas
        const roll = (keys.a ? 0.05 : 0) + (keys.d ? -0.05 : 0);
        car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, roll, 0.1);

        // Movimento
        car.position.x += Math.sin(carRotation) * speed;
        car.position.z += Math.cos(carRotation) * speed;

        // Giro das Rodas
        wheels.forEach(w => w.children[0].rotation.x += speed * 1.5);

        // Atualizar Velocímetro UI
        document.getElementById('speedometer').innerText = `${Math.round(Math.abs(speed) * 160)} KM/H`;

        // Lógica de Câmera Suave
        if (cameraMode === 0) { // 3ª Pessoa Chase
          const offset = new THREE.Vector3(0, 4, -9).applyAxisAngle(new THREE.Vector3(0, 1, 0), carRotation);
          targetCamPos.copy(car.position).add(offset);
          currentCamPos.lerp(targetCamPos, 0.1);
          camera.position.copy(currentCamPos);
          camera.lookAt(car.position.x, car.position.y + 1.2, car.position.z);

        } else if (cameraMode === 1) { // 1ª Pessoa Cockpit
          const offset = new THREE.Vector3(0, 1.2, 0.1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carRotation);
          camera.position.copy(car.position).add(offset);
          const lookTarget = car.position.clone().add(new THREE.Vector3(0, 1.2, 10).applyAxisAngle(new THREE.Vector3(0, 1, 0), carRotation));
          camera.lookAt(lookTarget);

        } else if (cameraMode === 2) { // Visão de Cima (Top-down)
          camera.position.set(car.position.x, car.position.y + 25, car.position.z - 1);
          camera.lookAt(car.position);
        }

      } else {
        // Lógica de Movimento a Pé
        let mx = 0, mz = 0;
        if (keys.w) mz += 1;
        if (keys.s) mz -= 1;
        if (keys.a) mx += 1;
        if (keys.d) mx -= 1;

        if (mx !== 0 || mz !== 0) {
          const pAngle = Math.atan2(mx, mz);
          player.rotation.y = pAngle;
          player.position.x += Math.sin(pAngle) * 0.16;
          player.position.z += Math.cos(pAngle) * 0.16;

          // Animação das pernas/braços andando
          legL.rotation.x = Math.sin(animTime * 3) * 0.6;
          legR.rotation.x = -Math.sin(animTime * 3) * 0.6;
          armL.rotation.x = -Math.sin(animTime * 3) * 0.6;
          armR.rotation.x = Math.sin(animTime * 3) * 0.6;
        } else {
          legL.rotation.x = 0;
          legR.rotation.x = 0;
          armL.rotation.x = 0;
          armR.rotation.x = 0;
        }

        document.getElementById('speedometer').innerText = `A PÉ`;

        // Câmera do Jogador
        camera.position.set(player.position.x, player.position.y + 5, player.position.z - 9);
        camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
      }

      renderer.render(scene, camera);
    }

    // Redimensionamento
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
