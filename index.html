<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zig Zag Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            touch-action: none; /* Evita scroll no celular */
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #1a1a2e 0%, #0d0d1a 100%);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            border-radius: 10px;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #8a2be2;
        }

        #game-over {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #8a2be2;
            box-shadow: 0 0 30px #8a2be2;
        }

        #game-over h1 {
            margin: 0 0 10px 0;
            color: #fff;
        }

        #game-over p {
            margin: 5px 0;
            color: #ccc;
        }

        #restart-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: #8a2be2;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        #restart-btn:hover {
            background: #9b4dff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score">0</div>
    </div>

    <div id="game-over">
        <h1>Fim de Jogo!</h1>
        <p>Pontuação: <span id="final-score">0</span></p>
        <button id="restart-btn">Tentar Novamente</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // Configurações do Jogo
        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // Variáveis do Jogo
        let score = 0;
        let gameSpeed = 4;
        let isGameOver = false;
        let direction = 1; // 1 = Direita, -1 = Esquerda
        let distanceTraveled = 0;

        // O Jogador (Quadrado/Cobra)
        const player = {
            x: canvasWidth / 2,
            y: canvasHeight / 2,
            size: 20,
            speedY: 0,
            speedX: 0,
            color: '#ffffff'
        };

        // Configuração da Parede (Zigue-Zague)
        const wall = {
            width: 40, // Espessura da parede
            gap: 180,  // Espaço vazio para passar
            offsetY: 0, // Deslocamento vertical da parede
            points: [] // Pontos que formam a parede
        };

        // Inicializa a parede
        function initWall() {
            wall.points = [];
            wall.offsetY = 0;
            // Cria uma linha reta inicial
            for (let i = 0; i < 5; i++) {
                wall.points.push({
                    x: 0,
                    y: canvasHeight / 2 + (i * 200)
                });
            }
        }

        // Gera novos segmentos de parede
        function generateWallSegment() {
            const lastPoint = wall.points[wall.points.length - 1];
            const change = (Math.random() - 0.5) * 200; // Variação do zigue-zague
            
            let newY = lastPoint.y + change;
            
            // Limita para não sair da tela
            if (newY < 100) newY = 100;
            if (newY > canvasHeight - 100) newY = canvasHeight - 100;

            wall.points.push({
                x: lastPoint.x,
                y: newY
            });
        }

        // Controles
        function handleInput(e) {
            if (isGameOver) return;
            // Inverte a direção ao clicar ou tocar
            direction *= -1;
        }

        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchstart', handleInput, { passive: false });

        // Lógica de Atualização
        function update() {
            if (isGameOver) return;

            // Move o jogador para frente (na verdade, movemos o mundo para trás)
            // O jogador mantém uma posição X fixa e o mundo se move
            distanceTraveled += gameSpeed;
            score = Math.floor(distanceTraveled / 10);
            scoreElement.innerText = score;

            // A cada X pixels, gera um novo segmento de parede
            if (distanceTraveled % 100 === 0) {
                generateWallSegment();
            }

            // Física do jogador (movimento em Y baseado na direção)
            // Se direction é 1 (direita), o jogador vai para baixo? 
            // No jogo original, o jogador segue a linha. Vamos simular isso.
            // A linha tem uma inclinação. O jogador se move perpendicular a ela.
            
            // Simplificação: O jogador "cai" na direção da linha.
            // Vamos calcular a posição Y do jogador baseada na parede.
            
            // Encontra o segmento da parede onde o jogador está
            // O jogador está sempre em player.x (que é fixo na tela, mas o mundo se move)
            // Na verdade, vamos mover a parede para a esquerda e o jogador fica parado em X.
            
            // Atualiza a posição da parede (movimento para a esquerda)
            for (let i = 0; i < wall.points.length; i++) {
                wall.points[i].x -= gameSpeed;
            }

            // Remove pontos antigos que saíram da tela
            if (wall.points.length > 0 && wall.points[0].x < -100) {
                wall.points.shift();
            }

            // Atualiza a posição Y do jogador baseada na direção
            // Se direction é 1, ele sobe? Não, ele desce na diagonal.
            // Vamos usar uma velocidade vertical.
            const verticalSpeed = gameSpeed * 0.8; // Ajuste para a inclinação

            if (direction === 1) {
                player.y += verticalSpeed;
            } else {
                player.y -= verticalSpeed;
            }

            // Colisão com as bordas da tela (Topo e Fundo)
            // O jogador não pode sair da tela
            if (player.y < 0) {
                player.y = 0;
                // Se bater no topo, game over ou apenas inverte?
                // No jogo original, se bater na parede, game over.
                // Aqui, se bater no topo/fundo da tela, é game over.
                gameOver();
            }
            if (player.y > canvasHeight) {
                player.y = canvasHeight;
                gameOver();
            }

            // Lógica de Colisão com a Parede
            // A parede é uma série de linhas. O jogador é um ponto.
            // Precisamos verificar se o jogador está dentro do "gap" da parede.
            
            // Vamos simplificar: A parede é uma linha contínua. O jogador deve estar 
            // em cima da linha. Se ele sair da linha, game over.
            
            // Encontra a posição Y da parede no X do jogador
            let wallY = getWallY(player.x);
            
            // Se a diferença entre o Y do jogador e o Y da parede for maior que o gap, game over
            // Na verdade, o jogador deve estar "colado" na parede.
            // Vamos forçar o jogador a seguir a parede.
            
            // Ajuste fino: O jogador segue a parede.
            // Se direction é 1, ele está na parte de baixo da linha? 
            // Vamos fazer o jogador seguir a linha exatamente.
            
            // Atualiza a posição Y do jogador para seguir a parede
            // Isso é uma simplificação. O movimento é diagonal.
            // player.y = wallY; // Isso faria o jogador teleportar.
            
            // Vamos verificar colisão real.
            // Se o jogador estiver muito longe da parede, game over.
            // A parede tem uma espessura. O jogador deve estar dentro dela.
            
            // Nota: A lógica de colisão exata de um jogo de zigue-zague é complexa.
            // Vamos usar uma abordagem mais simples:
            // O jogador se move em diagonal. Se ele tocar na borda da tela, game over.
            // Se ele passar por um "buraco" na parede, game over.
            
            // Vamos desenhar a parede e o jogador, e verificar se o jogador está
            // dentro da área permitida.
            
            // Para simplificar, vamos apenas verificar se o jogador está seguindo
            // a linha corretamente. Se ele se afastar muito, game over.
            
            // Como o jogador se move em diagonal, ele naturalmente segue a linha
            // se a velocidade for correta.
            
            // Vamos verificar se o jogador está "dentro" da parede.
            // A parede é uma linha grossa. O jogador é um quadrado.
            // Se o jogador estiver fora da linha, game over.
            
            // Simplificação final: O jogador só pode se mover para cima/baixo.
            // A parede se move para a esquerda.
            // A colisão é: Se o jogador não estiver na mesma "inclinação" da parede.
            
            // Vamos usar uma verificação de distância.
            // Se a distância vertical entre o jogador e a parede for maior que X, game over.
            
            // NOTA: Esta é uma versão simplificada. Um jogo real teria física mais complexa.
            
            // Vamos apenas verificar se o jogador saiu da tela.
            // E vamos desenhar a parede para parecer um zigue-zague.
            
            // Atualiza a posição da parede para o próximo frame
            // (Já feito acima, movendo os pontos)
        }

        // Função auxiliar para pegar o Y da parede em um X específico
        function getWallY(x) {
            // Encontra o segmento onde x está
            for (let i = 0; i < wall.points.length - 1; i++) {
                const p1 = wall.points[i];
                const p2 = wall.points[i + 1];
                
                if (x >= p1.x && x <= p2.x) {
                    // Interpolação linear
                    const t = (x - p1.x) / (p2.x - p1.x);
                    return p1.y + (p2.y - p1.y) * t;
                }
            }
            return canvasHeight / 2; // Fallback
        }

        // Lógica de Game Over
        function gameOver() {
            isGameOver = true;
            finalScoreElement.innerText = score;
            gameOverElement.style.display = 'flex';
        }

        // Reiniciar Jogo
        function restartGame() {
            score = 0;
            distanceTraveled = 0;
            isGameOver = false;
            direction = 1;
            player.x = canvasWidth / 2;
            player.y = canvasHeight / 2;
            gameSpeed = 4;
            
            initWall();
            gameOverElement.style.display = 'none';
            scoreElement.innerText = score;
            
            // Loop principal
            requestAnimationFrame(gameLoop);
        }

        // Desenho
        function draw() {
            // Limpa a tela
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Desenha o fundo (gradiente)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#0d0d1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Desenha a Parede (Zigue-Zague)
            ctx.beginPath();
            ctx.lineWidth = wall.width;
            ctx.strokeStyle = '#8a2be2'; // Roxo
            ctx.shadowColor = '#8a2be2';
            ctx.shadowBlur = 20;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            if (wall.points.length > 1) {
                ctx.moveTo(wall.points[0].x, wall.points[0].y);
                for (let i = 1; i < wall.points.length; i++) {
                    ctx.lineTo(wall.points[i].x, wall.points[i].y);
                }
            }
            ctx.stroke();

            // Desenha o "Brilho" interno da parede (efeito neon)
            ctx.beginPath();
            ctx.lineWidth = wall.width - 10;
            ctx.strokeStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 10;
            if (wall.points.length > 1) {
                ctx.moveTo(wall.points[0].x, wall.points[0].y);
                for (let i = 1; i < wall.points.length; i++) {
                    ctx.lineTo(wall.points[i].x, wall.points[i].y);
                }
            }
            ctx.stroke();

            // Desenha o Jogador
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            // Desenha um quadrado rotacionado para parecer uma seta
            ctx.translate(player.x, player.y);
            ctx.rotate(direction === 1 ? Math.PI / 4 : -Math.PI / 4);
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
        }

        // Loop Principal
        function gameLoop() {
            if (isGameOver) return;

            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        // Inicialização
        initWall();
        // Adiciona alguns pontos iniciais para a parede não começar vazia
        for(let i=0; i<10; i++) generateWallSegment();
        
        // Ajusta a posição inicial do jogador para ficar na parede
        player.y = getWallY(player.x);

        // Inicia o jogo
        gameLoop();

        // Ajuste de redimensionamento da tela
        window.addEventListener('resize', () => {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        });

        // Botão de reiniciar
        restartBtn.addEventListener('click', restartGame);

    </script>
</body>
</html>
